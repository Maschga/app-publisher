name: Android release build

on: workflow_dispatch

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out evcc app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: evcc-io/app
          ref: ${{ vars.EVCC_APP_REF }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version

      - name: Prepare branded app
        working-directory: app
        run: |
          cp ../eas.json eas.json
          npm ci

      - name: Start EAS Build
        working-directory: app
        env:
          EAS_NO_VCS: '1'
          EAS_PROJECT_ROOT: ${{ github.workspace }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27.11.0 build --platform android --profile production --non-interactive --no-wait
